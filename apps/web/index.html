<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9r2 — storage console</title>
    <meta name="description" content="One console for every R2 and S3 bucket you own: uploads, folders, share links, quotas and API keys." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8531f'/%3E%3Cpath d='M20.5 10.2c-1-1.1-2.4-1.7-4-1.7-3.2 0-5.6 2.4-5.6 5.9 0 3.3 2.2 5.7 5.3 5.7 2.3 0 4-1.3 4-3.3 0-1.8-1.4-3-3.2-3-1.6 0-2.8.9-3.1 2.3' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var mode = localStorage.getItem('9r2-theme') || 'system'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
